<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff | Research Genius Hub</title>
<meta name="description" content="Choose your service, see the price, send your requirements and pay by PayPal or M-Pesa.">
<meta name="robots" content="noindex">

<meta property="og:title" content="Place an Order | Research Genius Hub">
<meta property="og:description" content="Choose your service, see the price, send your requirements and pay by PayPal or M-Pesa.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://researchgeniushub.github.io/account.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://embed.tawk.to" crossorigin>
<style>
:root{
  --paper:#F6F7FA; --white:#FFFFFF; --ink:#0F1B33; --ink2:#46526B; --line:#D8DDE8;
  --teal:#0E7C86; --teal-d:#0A5B63; --hi:#FFE45C; --pen:#C0303C; --ok:#1E7B4A;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --max:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--teal-d);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:10px 14px;z-index:100}
.skip:focus{left:8px;top:8px}

h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;line-height:1.12;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,5.2vw,4.1rem);letter-spacing:-.025em}
h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
h3{font-size:1.35rem}
p{margin:0 0 1em;max-width:68ch}
.lede{font-size:1.2rem;color:var(--ink2);max-width:56ch}
.muted{color:var(--ink2)}
.small{font-size:.92rem}

/* header */
.site-header{position:sticky;top:0;z-index:50;background:rgba(246,247,250,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;gap:22px;min-height:66px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand b{font-weight:600}
.brand .hl{background:linear-gradient(transparent 58%,var(--hi) 58%,var(--hi) 92%,transparent 92%);padding:0 2px}
.nav{display:flex;gap:20px;margin-left:auto;align-items:center}
.nav a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.98rem;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{border-bottom-color:var(--teal)}
.hdr-actions{display:flex;gap:12px;align-items:center}
.menu-toggle{display:none;margin-left:auto;background:none;border:1.5px solid var(--ink);border-radius:8px;padding:8px 14px;font:600 .95rem var(--sans);color:var(--ink)}

/* buttons */
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border:1.5px solid var(--ink);border-radius:8px;padding:12px 20px;font:600 1rem var(--sans);cursor:pointer;text-align:center}
.btn:hover{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:var(--ink);color:#fff}
.btn.sm{padding:8px 14px;font-size:.93rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{display:block;width:100%}

/* hero */
.hero{padding:56px 0 64px;background-color:var(--paper);background-image:linear-gradient(#E6EAF2 1px,transparent 1px),linear-gradient(90deg,#E6EAF2 1px,transparent 1px);background-size:34px 34px;background-position:-1px -1px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.hero h1{max-width:13ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 34px}
.markup{border-left:3px solid var(--line);padding:4px 0 4px 18px;max-width:46ch}
.markup q{font-family:var(--serif);font-size:1.3rem;quotes:none;display:block;line-height:1.35}
mark{background:linear-gradient(transparent 12%,var(--hi) 12%,var(--hi) 88%,transparent 88%);color:inherit;padding:0 2px}
.pen{font-family:var(--serif);font-style:italic;color:var(--pen);font-size:1.02rem;display:block;margin-top:6px;transform:rotate(-1deg);transform-origin:left}
.markup small{display:block;color:var(--ink2);margin-top:10px;font-size:.88rem}

/* calculator: the quote slip */
.calc{background:var(--white);border:1.5px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--hi);padding:24px;position:relative}
.calc h2,.calc h3{font-size:1.5rem;margin-bottom:.3em}
.calc .sub{color:var(--ink2);font-size:.95rem;margin-bottom:16px}
.calc fieldset{border:0;padding:0;margin:0 0 14px}
.calc legend,.calc label.lbl,.f label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;padding:10px 8px;text-align:center;cursor:pointer;font-weight:500;font-size:.93rem;border-right:1.5px solid var(--ink);background:#fff}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--ink);color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--teal);outline-offset:-3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=datetime-local],select,textarea{width:100%;font:400 1rem var(--sans);color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px}
textarea{min-height:130px;resize:vertical}
.total{border-top:2px dashed var(--ink);margin-top:18px;padding-top:16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.total output{font-family:var(--serif);font-size:2.6rem;font-weight:600;letter-spacing:-.02em;line-height:1}
.breakdown{color:var(--ink2);font-size:.93rem;margin:8px 0 16px}
.cur{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink2);margin-bottom:14px}
.cur select{width:auto;padding:5px 8px;font-size:.88rem}

/* sections */
section.s{padding:68px 0;border-top:1px solid var(--line)}
section.s.tint{background:var(--white)}
.sec-head{max-width:60ch;margin-bottom:34px}

/* strip */
.strip{padding:22px 0;background:var(--ink);color:#fff}
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center}
.strip strong{font-family:var(--serif);font-weight:500;font-size:1.1rem}
.strip span{opacity:.88;font-size:.95rem}

/* service rows */
.rows{border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:.9fr 1.6fr 150px;gap:12px 32px;padding:24px 0;border-bottom:1px solid var(--line);align-items:start}
.row h3{margin:0}
.row p{margin:0 0 .4em}
.row .price{font-family:var(--serif);font-size:1.25rem;font-weight:600;white-space:nowrap}
.row .price small{display:block;font:400 .85rem var(--sans);color:var(--ink2);text-align:right}

/* process: a true sequence */
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:14px}
.steps li::before{content:counter(s);font-family:var(--serif);font-size:1.7rem;font-weight:600;color:var(--teal-d);display:block;line-height:1;margin-bottom:8px}
.steps h3{font-size:1.15rem;margin-bottom:.3em}
.steps p{font-size:.97rem;color:var(--ink2);margin:0}

/* tables */
table.rates{border-collapse:collapse;width:100%;max-width:640px;background:#fff;border:1.5px solid var(--ink)}
.rates th,.rates td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.rates th{background:var(--ink);color:#fff;font-weight:600}
.rates td:last-child{font-family:var(--serif);font-weight:600;font-size:1.15rem}

/* two col content */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.panel{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:24px}
.panel h3{margin-top:0}
ul.plain{padding-left:1.1em;margin:0 0 1em}
ul.plain li{margin-bottom:.4em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{border:1.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:.92rem;background:#fff}

/* guides + faq */
details{border-bottom:1px solid var(--line);padding:14px 0}
details:first-of-type{border-top:1.5px solid var(--ink)}
summary{cursor:pointer;font-family:var(--serif);font-size:1.3rem;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--sans);font-weight:400;font-size:1.5rem;line-height:1}
details[open] summary::after{content:"\2212"}
details .body{padding:12px 0 6px;max-width:68ch}
details .body h4{margin:1.1em 0 .3em;font-size:1rem}

/* samples */
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sample{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px}
.sample h3{margin:0;font-size:1.2rem}
.sample .meta{color:var(--ink2);font-size:.9rem}
.sample .soon{color:var(--ink2);font-style:italic;font-family:var(--serif)}
.sample .btn{margin-top:auto;align-self:flex-start}

/* account */
.demo-note{background:var(--hi);border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px;font-size:.93rem;margin-bottom:22px}
.auth{max-width:460px}
.tabs{display:flex;gap:0;margin-bottom:18px}
.tabs button{flex:1;padding:12px;border:1.5px solid var(--ink);background:#fff;font:600 1rem var(--sans);cursor:pointer;color:var(--ink)}
.tabs button+button{border-left:0}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.f{margin-bottom:14px}
.f .hint{font-size:.85rem;color:var(--ink2);margin-top:4px}
.err{color:var(--pen);font-weight:600;font-size:.95rem;min-height:1.4em}
.ok{color:var(--ok);font-weight:600}
.dash-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:36px;align-items:start}
.order{border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:16px 18px;margin-bottom:14px}
.order h4{margin:0 0 4px;font-family:var(--serif);font-size:1.15rem;font-weight:600}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid var(--ink);background:#fff}
.badge.due{background:var(--hi)}
.badge.paid{background:#D6F0E1;border-color:var(--ok);color:#12522F}
.paybox{margin-top:14px;border-top:2px dashed var(--ink);padding-top:14px}
.paybox dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 14px;font-size:.95rem}
.paybox dt{font-weight:600}
.paybox dd{margin:0;word-break:break-all}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}

/* footer */
.site-footer{background:var(--ink);color:#DCE2EE;padding:48px 0 28px;margin-top:0}
.site-footer a{color:#fff}
.site-footer .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.site-footer h4{font-family:var(--sans);font-size:.95rem;margin:0 0 10px;color:#fff}
.site-footer ul{list-style:none;margin:0;padding:0}
.site-footer li{margin-bottom:6px;font-size:.95rem}
.site-footer .brand{color:#fff;font-size:1.4rem}
.site-footer .legal{border-top:1px solid #2A3857;margin-top:30px;padding-top:16px;font-size:.85rem;opacity:.85}

/* whatsapp */
.wa{position:fixed;left:16px;bottom:16px;z-index:60;background:#1FA855;color:#fff;font-weight:700;text-decoration:none;border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none}
.wa.on{display:inline-block}
.wa:hover{color:#fff;background:#178a45}

.page-head{padding:52px 0 30px}
.page-head h1{font-size:clamp(2.1rem,4.4vw,3.2rem);max-width:20ch}

@media (max-width:940px){
  .hero .wrap,.cols,.dash-grid{grid-template-columns:1fr}
  .hero .wrap{gap:36px}
  .steps{grid-template-columns:1fr 1fr}
  .samples{grid-template-columns:1fr 1fr}
  .site-footer .grid{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr}
  .row .price small{text-align:left}
}
@media (max-width:820px){
  .menu-toggle{display:block}
  .nav,.hdr-actions{display:none}
  .site-header.open .wrap{flex-wrap:wrap;padding-bottom:14px}
  .site-header.open .nav,.site-header.open .hdr-actions{display:flex;width:100%;flex-direction:column;align-items:flex-start;gap:10px;margin-left:0}
}
@media (max-width:560px){
  .steps,.samples,.site-footer .grid,.two{grid-template-columns:1fr}
  .hero{padding-top:34px}
  .calc{padding:18px;box-shadow:5px 5px 0 var(--hi)}
  .total output{font-size:2.2rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* about, values, motto */
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.about-list{display:grid;grid-template-columns:1fr 1fr;gap:26px 30px}
.about-list div{border-top:3px solid var(--ink);padding-top:12px}
.about-list h3{font-size:1.2rem;margin-bottom:.3em}
.about-list p{font-size:.97rem;color:var(--ink2);margin:0}
.values{margin:0;border-top:1.5px solid var(--ink)}
.values div{display:grid;grid-template-columns:.8fr 2fr;gap:8px 32px;padding:18px 0;border-bottom:1px solid var(--line)}
.values dt{font-family:var(--serif);font-size:1.3rem;font-weight:600}
.values dd{margin:0;color:var(--ink2)}
.motto{background:var(--teal-d);color:#fff;padding:54px 0}
.motto p{font-family:var(--serif);font-size:clamp(1.7rem,3.8vw,2.9rem);line-height:1.18;letter-spacing:-.02em;max-width:24ch;margin:0}
@media (max-width:940px){.about{grid-template-columns:1fr;gap:30px}.values div{grid-template-columns:1fr}}
@media (max-width:560px){.about-list{grid-template-columns:1fr}}

/* illustrations and icons */
.scene{display:block;width:100%;max-width:520px;height:auto;margin-top:30px}
.row h3{display:flex;align-items:center;gap:12px}
.ic{width:30px;height:30px;flex:none;fill:none;stroke:var(--teal-d);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.motto .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.motto img{width:100%;max-width:380px;height:auto;justify-self:end}
.hero .markup{background:rgba(246,247,250,.9);padding-right:12px}
@media (max-width:760px){.motto .wrap{grid-template-columns:1fr}.motto img{justify-self:start}}

/* home v2: calmer */
.view[hidden]{display:none}
.hero .wrap{align-items:center}
.hero h1{max-width:19ch;font-size:clamp(2rem,4.1vw,3.3rem);line-height:1.1}
.motto-line{font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,2.2vw,1.65rem);color:var(--teal-d);margin:18px 0 0;max-width:34ch;line-height:1.3}
.hero .cta-row{margin:26px 0 0}
.hero .scene{margin:0;max-width:540px;justify-self:end}
.about-list.four{grid-template-columns:repeat(4,1fr)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 36px}
.tiles h3{font-size:1.2rem;margin-bottom:.3em}
.tiles p{margin:0;color:var(--ink2);font-size:.98rem}
.btn.yellow{background:var(--hi);color:var(--ink);border-color:var(--hi)}
.btn.yellow:hover{background:#fff;border-color:#fff;color:var(--ink)}
.motto p:first-child{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:0 0 20px}
.motto .small{font-family:var(--sans);font-size:.95rem;max-width:none}
section.s{padding:56px 0}
@media (max-width:940px){.about-list.four{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:1fr 1fr}.hero .scene{justify-self:start}}
@media (max-width:560px){.about-list.four,.tiles{grid-template-columns:1fr}}

/* samples + pay tabs */
.sample .intro{border:0;padding:0}
.sample .intro summary{font:600 .95rem var(--sans);color:var(--teal-d);text-decoration:underline;text-underline-offset:3px;display:block}
.sample .intro summary::after{content:""}
.sample .intro p{font-family:var(--serif);font-size:1.02rem;margin:10px 0 0;padding:10px 0 10px 14px;border-left:3px solid var(--hi)}
.sample .locked{margin-top:auto;border-top:2px dashed var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sample .badge{align-self:flex-start}
.paytabs{flex-wrap:wrap;gap:6px}
.paytabs button{flex:1 1 auto;border:1.5px solid var(--ink)!important;border-radius:8px}
.samples{align-items:start}

.about-list.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:940px){.about-list.three{grid-template-columns:1fr}}
.approx{color:var(--ink2);font-size:.88rem;margin:-6px 0 12px}
.cur select{min-width:150px}

/* chat */
.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:70}
.chat-launch{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:12px 20px;font:600 1rem var(--sans);cursor:pointer;box-shadow:4px 4px 0 var(--hi)}
.chat-launch:hover{background:var(--teal-d);border-color:var(--teal-d)}
.chat-panel{width:350px;max-width:calc(100vw - 32px);background:#fff;border:1.5px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 var(--hi);display:flex;flex-direction:column;overflow:hidden;max-height:min(520px,calc(100vh - 40px))}
.chat-panel[hidden]{display:none}
.chat-panel header{background:var(--ink);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat-panel header strong{display:block;font-family:var(--serif);font-size:1.1rem;font-weight:600}
.chat-panel header span{font-size:.85rem;opacity:.85}
.chat-x{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;padding:0 4px}
.chat-log{padding:14px;overflow-y:auto;flex:1;min-height:150px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 12px;border-radius:10px;font-size:.95rem;line-height:1.45;max-width:90%}
.msg.bot{background:var(--paper);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--ink);color:#fff;align-self:flex-end}
.msg.small{font-size:.85rem;color:var(--ink2)}
.chat-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chat{transition:bottom .2s}.chat.lifted{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 80px)}
.chat-actions .wa-btn{background:#1FA855;border-color:#1FA855;color:#fff}.chat-actions .wa-btn:hover{background:#178a45;border-color:#178a45;color:#fff}
.brand-mark{height:42px;width:auto;background:#fff;border-radius:10px;padding:2px 4px;object-fit:contain;flex:none}
.site-footer .brand-mark{height:48px}
@media (max-width:560px){.brand-mark{height:34px}.brand{font-size:1.1rem}}
.chat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chat-chips button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:4px 11px;font:500 .85rem var(--sans);cursor:pointer;color:var(--ink)}
.chat-chips button:hover{background:var(--hi)}
.chat-form{display:flex;gap:8px;border-top:1px solid var(--line);padding:10px}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media (max-width:560px){.wa{bottom:max(16px,env(safe-area-inset-bottom,0px))}.chat-launch{padding:10px 14px}}

table.rates{max-width:720px}.rates th:not(:first-child),.rates td:not(:first-child){text-align:right}
[hidden]{display:none!important}

/* ---- v3: cards, stats, how it works, CTA and related links ---- */
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{display:block;background:var(--white);border:1.5px solid var(--ink);border-radius:14px;padding:22px 22px 20px;color:var(--ink);text-decoration:none;box-shadow:5px 5px 0 var(--hi);transition:transform .15s ease,box-shadow .15s ease}
a.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--hi);color:var(--ink)}
.card h3{font-size:1.25rem;margin:10px 0 .3em}
.card p{margin:0;color:var(--ink2);font-size:.98rem}
.card .ic,.ic-lg{width:34px;height:34px;fill:none;stroke:var(--teal-d);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .more{display:inline-block;margin-top:12px;font-weight:700;font-size:.95rem;color:var(--teal-d)}
.cardgrid.four{grid-template-columns:repeat(4,1fr)}
.statbar{background:var(--ink);color:#fff;padding:26px 0}
.statbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.statbar b{display:block;font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1.1;color:var(--hi)}
.statbar span{font-size:.93rem;opacity:.9}
.faqmini details{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 18px;margin-bottom:10px}
.faqmini summary{font-weight:700;padding:14px 0;cursor:pointer}
.faqmini .body{padding:0 0 14px;color:var(--ink2)}
.ctaband{background:var(--teal-d);color:#fff;padding:40px 0}
.ctaband .wrap{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.ctaband h2{font-size:clamp(1.5rem,3vw,2.1rem);margin:0;max-width:24ch;color:#fff}
.ctaband .btn.alt{background:transparent;color:#fff;border-color:#fff}
.related{padding:26px 0;border-top:1px solid var(--line);background:var(--white)}
.related h2{font-size:1.1rem;font-family:var(--sans);font-weight:700;margin:0 0 8px;letter-spacing:0}
.related ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px}
.legal a{color:inherit;opacity:.8;margin-left:14px}
@media (max-width:900px){.cardgrid,.cardgrid.four{grid-template-columns:1fr 1fr}.statbar .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.cardgrid,.cardgrid.four{grid-template-columns:1fr}}

/* ---- v4: dark header to match footer ---- */
.site-header{background:rgba(15,27,51,.98);border-bottom:1px solid #22345a;backdrop-filter:none}
.site-header .brand,.site-header .brand:hover{color:#fff}
.site-header .nav a{color:#fff}
.site-header .nav a:hover,.site-header .nav a[aria-current="page"]{border-bottom-color:var(--hi);color:#fff}
.site-header .hdr-actions a:not(.btn){color:#fff}
.site-header .btn{background:var(--hi);border-color:var(--hi);color:var(--ink)}
.site-header .btn:hover{background:#fff;border-color:#fff;color:var(--ink)}
.site-header .menu-toggle{border-color:#fff;color:#fff}
.site-header img[width="38"]{border-radius:9px;box-shadow:0 0 0 1.5px #3a4d78}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:start}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.field-row{grid-template-columns:1fr}}


/* v5: mobile floating buttons must never cover the footer; testimonials more visible */
@media (max-width:700px){.site-footer{padding-bottom:150px}.site-footer .legal{line-height:1.9}.site-footer .legal a{display:inline-block;margin-left:0}.wa{padding:8px 13px;font-size:.82rem;bottom:max(12px,env(safe-area-inset-bottom,0px))}.chat-launch{padding:8px 13px;font-size:.88rem}}
.reviews{gap:20px}
.reviews figure{background:#fff;border:1px solid var(--line,#d9dee8);border-left:5px solid var(--hi);border-radius:10px;padding:20px 20px 16px;box-shadow:0 6px 18px rgba(15,27,51,.08)}
.reviews blockquote{font-size:1.12rem}
.reviews figcaption{font-weight:700;color:var(--ink)}
#reviews .sec-head h2{font-size:2rem}

/* v6: order rows */
.orow{padding:0!important;overflow:hidden}
.orow-head,.orow-cols{display:grid;grid-template-columns:2.2fr 1.5fr 1.1fr .9fr .9fr 1.2fr 1.1fr 84px;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 12px}
.orow-head{background:none;border:0;cursor:pointer}.orow-head:hover,.orow.open .orow-head{background:#f4f6fb}
.orow-cols{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--ink);margin-top:10px}
.orow-head span{font-size:.9rem;overflow-wrap:anywhere}.orow-head .pv{font-weight:700;text-decoration:underline}
.orow-body{display:none;padding:6px 18px 18px;border-top:1px solid #d9dee8}.orow.open .orow-body{display:block}
.orow-head .lab{display:none}
@media(max-width:820px){.orow-cols{display:none}.orow-head{grid-template-columns:1fr 1fr}.orow-head .lab{display:inline;font-size:.72rem;color:#555;text-transform:uppercase;display:block}}
</style>

<script>
(async function () {
  const C = window.RGH, $ = (s, r) => (r || document).querySelector(s), money = n => "£" + Number(n || 0).toFixed(2);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const load = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src)); document.head.appendChild(s); });
  await load("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
  const sb = window.supabase.createClient(C.supabase.url, C.supabase.anonKey);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = "account.html?staff=1"; return; }
  const { data: role } = await sb.rpc("my_role");
  if (!/^(admin|staff|staff_pending)$/.test(role)) { location.href = "account.html"; return; }
  if (role === "staff_pending") { await pendingScreen(); return; }
